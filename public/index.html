<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFT Portfolio Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="lite-top">
    <span class="lite-brand">NFT Portfolio <b>Lite</b></span>
    <span class="lite-note">Read-only · addresses only · never asks for a key or seed phrase</span>
  </header>
  <main class="main">
    <section class="tab is-active" data-tab="portfolio">
      <div class="card">
        <div class="pf-top">
          <!-- The balance as three cards: the whole, and the two parts of it.
               On its own above the tables it read as a stray number. -->
          <div class="pf-stats">
            <div class="pf-stat">
              <span class="pf-stat-label">Total value</span>
              <div class="pf-stat-row">
                <b id="portfolio-total" class="pf-stat-value">—</b>
                <span id="portfolio-move" class="move-pill"></span>
              </div>
            </div>
            <div class="pf-stat">
              <span class="pf-stat-label">NFT</span>
              <b id="portfolio-nft" class="pf-stat-value">—</b>
            </div>
            <div class="pf-stat">
              <span class="pf-stat-label">Token</span>
              <b id="portfolio-token" class="pf-stat-value">—</b>
            </div>
          </div>
          <!-- Only for loading and errors: the counts it used to show were a
               line nobody read. -->
          <span id="portfolio-summary" class="pf-summary"></span>
          <!-- The controls as a fourth card beside the three figures: how old
               they are on top, what to show and do with them underneath. -->
          <div class="pf-stat pf-controls">
          <span id="portfolio-updated" class="pf-updated"></span>
          <div class="card-actions">
            <div id="portfolio-wallets" class="portfolio-wallets"></div>
            <!-- Refresh and add, one frame: both act on what the table holds. -->
            <div class="btn-join">
            <button id="portfolio-settings" class="btn btn-mini is-icon" type="button"
                    aria-label="Wallets and settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
            <button id="portfolio-history" class="btn btn-mini is-icon" type="button"
                    aria-label="Price changes, last 24 hours">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
              </svg>
            </button>
            <button id="portfolio-refresh" class="btn btn-mini is-icon pf-refresh"
                    aria-label="Refresh the portfolio">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 4v6h-6"></path>
                <path d="M1 20v-6h6"></path>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
                <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
            <button id="portfolio-add" class="btn btn-mini is-icon" type="button"
                    aria-label="Add an NFT by hand">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
            </div>
          </div>
          </div>
        </div>
        <div id="portfolio-filter-note" class="portfolio-filter-note"></div>

        <!-- OpenSea's own portfolio layout: the collections as a table that
             sorts by its numbers, the tokens in a column beside it. -->
        <div class="pf-layout">
          <div class="pf-main">
            <div class="pf-head">
              <span class="pf-col-name">Collection</span>
              <span class="pf-chain-col">Network</span>
              <span class="pf-num">Held</span>
              <span class="pf-wallets-col">Wallets</span>
              <button type="button" class="pf-sort pf-num" data-sort="value">Value</button>
              <button type="button" class="pf-sort pf-num" data-sort="floor">Floor price</button>
              <button type="button" class="pf-sort pf-num" data-sort="offer">Top offer</button>
            </div>
            <div id="portfolio-cards" class="pf-rows"></div>
          </div>
          <aside id="portfolio-tokens-wrap" class="pf-tokens">
            <div class="pf-tok-head">
              <span>Token</span>
              <span class="pf-chain-col">Network</span>
              <span class="pf-num">Value</span>
              <span class="pf-num">Held qty</span>
              <span class="pf-wallets-col">Wallets</span>
              <span class="pf-num">Price</span>
              <span class="pf-num">24h</span>
            </div>
            <div id="portfolio-tokens" class="pf-token-list"></div>
          </aside>
        </div>
      </div>
    </section>
  </main>
  <footer class="lite-foot">
    Not affiliated with OpenSea. Reads the same data OpenSea's own site uses, which can change without notice.
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
